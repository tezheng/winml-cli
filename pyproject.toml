[project]
name = "llm-layers"
version = "0.1.0"
description = "Minimal API for assembling mainstream small language models"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4.0",
    "safetensors>=0.4.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "transformers>=4.51.0",
    "huggingface-hub>=0.24",
    "accelerate>=0.30",
]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
]
openvino = [
    "openvino>=2026.1",
    "openvino-genai>=2026.1",
    "optimum-intel[openvino]>=1.20",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_untyped_defs = true
warn_return_any = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-ra"
markers = [
    "gate: HF numerical-equivalence gate test (requires HF weights, skip-friendly).",
]
